<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1440">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GoBritanya">
<title>GoBritanya — Student App (Prototype)</title>
<style>
:root{
  --navy:#0B1440; --navy-2:#1A2560; --red:#D0021B; --red-2:#E8132E; --red-tint:#FDECEE;
  --bg:#F4F5F9; --card:#FFFFFF; --text:#0B1440; --muted:#69708A; --line:#E6E8F0;
  --green:#1E8E4E; --green-tint:#E6F6EC; --amber:#9A6A00; --amber-tint:#FFF4D6;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(11,20,64,.05),0 6px 20px rgba(11,20,64,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--font);color:var(--text);background:#E9EBF2;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
input,textarea,select{font:inherit;color:inherit}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Stage & device frame (desktop) ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:12px 24px}
.pitch{max-width:340px;display:none}
.pitch .logo{font-size:40px}
.pitch h2{font-size:22px;margin:18px 0 4px;font-weight:800;letter-spacing:-.02em}
.pitch .ver{color:var(--muted);font-size:14px;margin:0 0 22px}
.pitch ol{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.pitch li{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.45;color:#2A3156}
.pitch li b{display:block;color:var(--navy);font-size:15px}
.pitch li .n{flex:none;width:28px;height:28px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.pitch .src{margin-top:22px;font-size:12.5px;color:var(--muted);line-height:1.5}
.pitch .reset{margin-top:14px;font-size:13px;font-weight:600;color:var(--red)}
@media (min-width:1000px){.pitch{display:block}}

.device{width:390px;height:844px;border-radius:58px;background:#0E0F13;padding:11px;box-shadow:0 0 0 2px #2b2d33,0 40px 80px rgba(11,20,64,.25);flex:none;position:relative}
.screen{position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;overflow:clip;background:var(--bg);display:flex;flex-direction:column;isolation:isolate}
.statusbar{height:50px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px 34px;font-weight:600;font-size:15px;background:#fff;position:relative;z-index:5}
.statusbar .island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000}
.statusbar .sys{display:flex;gap:6px;align-items:center}
.statusbar .sys svg{height:12px;width:auto;fill:var(--text)}


/* ---------- App shell ---------- */
#app{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden;overflow:clip}
.appbar{flex:none;background:#fff;padding:6px 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:4;border-bottom:1px solid transparent}
.appbar.scrolled{border-bottom-color:var(--line)}
.logo{font-weight:800;letter-spacing:-.035em;font-size:23px;line-height:1}
.logo .go{color:var(--navy)} .logo .br{color:var(--red)}
.appbar .title{font-weight:700;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bg);flex:none}
.lang{display:flex;background:var(--bg);border-radius:999px;padding:3px;flex:none}
.lang button{font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:999px;color:var(--muted);min-width:38px;text-align:center}
.lang button.on{background:var(--navy);color:#fff}
.main{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:28px;scroll-behavior:auto}
.main::-webkit-scrollbar{width:0}
.pad{padding:0 18px}
.sec{margin-top:26px}
.eyebrow{margin:16px 0 2px;color:var(--muted);font-size:14px;font-weight:600}
.h1{font-size:32px;line-height:1.08;font-weight:800;letter-spacing:-.03em;margin:4px 0 0}
.h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0}
.h3{font-size:19px;font-weight:800;letter-spacing:-.015em;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.h3 small{font-size:13px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.sample{display:inline-flex;align-items:center;vertical-align:middle;font-size:10.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:#7A5A00;background:var(--amber-tint);border:1px dashed #E2C266;border-radius:6px;padding:2px 6px;margin-left:6px;white-space:nowrap}
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow)}

/* ---------- Tab bar ---------- */
.tabbar{flex:none;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:0 10px calc(env(safe-area-inset-bottom) + 22px);position:relative;z-index:4}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 2px;font-size:12px;font-weight:600;color:#3A4166;position:relative}
.tab.on{color:var(--red)}
.tab.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--red)}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#0E0F13}

/* ---------- Buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:14px;font-weight:700;font-size:16.5px;transition:transform .12s ease,opacity .12s}
.btn:active{transform:scale(.98)}
.btn--red{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(208,2,27,.25)}
.btn--navy{background:var(--navy);color:#fff}
.btn--ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--red);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px}

/* ---------- Home ---------- */
.stay-card{display:block;width:100%;margin-top:16px;background:linear-gradient(135deg,var(--navy) 0%,#1B2A72 100%);color:#fff;border-radius:var(--r-lg);padding:18px 18px 16px;position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(11,20,64,.25)}
.stay-card::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(208,2,27,.55),rgba(208,2,27,0) 70%)}
.stay-card .top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-weight:700;font-size:12.5px;padding:6px 11px}
.pill--glass{background:rgba(255,255,255,.14);color:#fff}
.stay-card h2{margin:14px 0 2px;font-size:24px;font-weight:800;letter-spacing:-.02em;position:relative;z-index:1}
.stay-card p{margin:0;opacity:.8;font-size:14.5px;position:relative;z-index:1}
.stay-card .meta{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px;font-weight:600;position:relative;z-index:1}
.stay-card .meta svg{width:18px;height:18px}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.18);margin-top:14px;overflow:hidden;position:relative;z-index:1}
.bar>div{height:100%;background:#fff;border-radius:6px;transition:width .4s ease}
.stay-card small{display:block;margin-top:8px;font-size:12.5px;opacity:.85;position:relative;z-index:1}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa a,.qa button{min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:600;text-align:center;line-height:1.2;color:#2A3156}
.qa .ico{width:58px;height:58px;border-radius:18px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;color:var(--navy)}
.qa .ico.red{background:var(--red);color:#fff;box-shadow:0 6px 14px rgba(208,2,27,.25)}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:4px 18px 10px;margin:0 -18px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.perk{flex:0 0 238px;scroll-snap-align:start;border-radius:var(--r-lg);padding:16px;color:#fff;display:flex;flex-direction:column;min-height:178px;position:relative;overflow:hidden}
.perk .tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.perk h4{margin:8px 0 6px;font-size:18px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.perk p{margin:0;font-size:13px;line-height:1.4;opacity:.9}
.perk .foot{margin-top:auto;padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.code{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1px dashed rgba(255,255,255,.6);border-radius:10px;padding:7px 10px;font-weight:800;font-size:13px;letter-spacing:.04em}
.code svg{width:15px;height:15px}
.perk .more{font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:2px;opacity:.95}
.perk .more svg{width:15px;height:15px}
.perk.p1{background:linear-gradient(140deg,#D0021B,#8E0013)}
.perk.p2{background:linear-gradient(140deg,#0B1440,#28408F)}
.perk.p3{background:linear-gradient(140deg,#1C6B5A,#0F3F36)}
.perk.p4{background:linear-gradient(140deg,#5B2A86,#2E1450)}
.community{padding:16px}
.community .head{display:flex;gap:12px;align-items:center}
.community .badge{width:46px;height:46px;border-radius:14px;background:var(--red-tint);color:var(--red);display:grid;place-items:center;flex:none}
.community h4{margin:0;font-size:16.5px;font-weight:800}
.community p{margin:2px 0 0;font-size:13.5px;color:var(--muted);line-height:1.4}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.group{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.3}
.group b{display:block;font-size:13.5px;margin-bottom:2px}
.event{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.event .date{width:48px;flex:none;border-radius:12px;background:var(--navy);color:#fff;text-align:center;padding:6px 0;line-height:1.05}
.event .date b{display:block;font-size:18px}
.event .date span{font-size:11px;text-transform:uppercase;font-weight:700;opacity:.8}
.event .t{font-weight:700;font-size:14.5px}
.event .s{font-size:12.5px;color:var(--muted)}
.blog{display:flex;gap:12px;padding:12px;align-items:stretch}
.blog+.blog{margin-top:10px}
.blog .thumb{width:92px;flex:none;border-radius:14px;overflow:hidden;position:relative;min-height:92px;background:var(--navy)}
.blog .thumb img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.blog .thumb .gl{position:absolute;inset:0;display:grid;place-items:center;color:#fff}
.blog .thumb .gl svg{width:34px;height:34px;stroke-width:1.5}
.blog .k{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.blog h4{margin:4px 0 4px;font-size:15px;line-height:1.25;font-weight:800}
.blog p{margin:0;font-size:12.8px;line-height:1.4;color:var(--muted)}
.blog .rd{margin-top:6px;font-size:12px;font-weight:700;color:var(--navy);display:inline-flex;align-items:center;gap:3px}
.blog .rd svg{width:14px;height:14px}

/* ---------- My stay ---------- */
.photo{position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/11;background:var(--navy);box-shadow:var(--shadow)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ptag{position:absolute;left:10px;bottom:10px;background:rgba(11,20,64,.62);backdrop-filter:blur(6px);color:#fff;font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.fact{background:#fff;border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.fact span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.fact b{display:block;font-size:14.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.checklist{list-style:none;margin:0;padding:0;background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.checklist li+li{border-top:1px solid var(--line)}
.ck{display:flex;align-items:center;gap:13px;width:100%;padding:14px 14px;min-height:62px}
.ck .box{width:26px;height:26px;border-radius:50%;border:2px solid #C3C8D8;display:grid;place-items:center;flex:none;transition:all .2s}
.ck .box svg{width:15px;height:15px;stroke:#fff;stroke-width:3;opacity:0;transform:scale(.4);transition:all .2s}
.ck.done .box{background:var(--green);border-color:var(--green)}
.ck.done .box svg{opacity:1;transform:scale(1)}
.ck .txt{flex:1;min-width:0}
.ck .txt b{display:block;font-size:15px;font-weight:600}
.ck.done .txt b{color:#4A5170}
.ck .txt small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.ck .txt small.ok{color:var(--green);font-weight:600}
.ck>svg.i{color:#B6BBCC;width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:#2A3156}
.chip svg{width:16px;height:16px;color:var(--green)}
.row{display:flex;align-items:center;gap:12px;padding:14px;min-height:60px;width:100%}
.row+.row{border-top:1px solid var(--line)}
.row .ri{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none;color:var(--navy)}
.row .ri svg{width:20px;height:20px}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-size:15px;font-weight:700}
.row .rt small{display:block;font-size:12.8px;color:var(--muted);margin-top:1px;line-height:1.35}
.row>svg.i{color:#B6BBCC;width:18px;height:18px}

/* ---------- Forms ---------- */
.label{display:block;font-size:14px;font-weight:700;margin:22px 0 10px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow);padding:10px}
.stepper button{width:52px;height:52px;border-radius:14px;background:var(--bg);display:grid;place-items:center;color:var(--navy)}
.stepper button svg{width:22px;height:22px;stroke-width:2.4}
.stepper output{text-align:center;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.stepper output small{display:block;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;margin-top:4px}
.seg{display:flex;gap:8px;margin-top:10px}
.seg button{flex:1;padding:10px 0;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:14px;text-align:center}
.seg button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.dates{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:16px;padding:14px}
.dates span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.dates b{display:block;font-size:15.5px;margin-top:3px}
.dates .arrow{color:var(--muted)}
.dates .new b{color:var(--red)}
.field{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;outline:none;transition:border-color .15s}
.field:focus{border-color:var(--navy)}
textarea.field{min-height:96px;resize:none;line-height:1.4}
.info{display:flex;gap:10px;background:#EEF1FB;border-radius:14px;padding:12px 14px;font-size:13.2px;line-height:1.45;color:#2A3156;margin-top:16px}
.info svg{width:20px;height:20px;color:var(--navy);margin-top:1px}
.info.warn{background:var(--amber-tint);color:#5E4600}
.info.warn svg{color:var(--amber)}
.mini-res{display:flex;gap:12px;align-items:center;padding:12px}
.mini-res .th{width:56px;height:56px;border-radius:14px;overflow:hidden;flex:none}
.mini-res .th img{width:100%;height:100%;object-fit:cover}
.mini-res b{display:block;font-size:16px}
.mini-res small{color:var(--muted);font-size:13px}

/* ---------- Confirmation ---------- */
.success{text-align:center;padding:26px 18px 6px}
.success .tick{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;background:var(--green);display:grid;place-items:center;box-shadow:0 0 0 10px var(--green-tint);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.success .tick svg{width:42px;height:42px;stroke:#fff;stroke-width:3}
.success h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.success p{margin:8px auto 0;max-width:290px;color:var(--muted);font-size:15px;line-height:1.45}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.req{padding:16px;margin-top:20px;border-left:4px solid var(--red)}
.req .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.req h3{margin:0;font-size:19px;font-weight:800}
.req ul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.req li{display:flex;gap:10px;align-items:center;font-size:15px}
.req li svg{width:20px;height:20px;color:var(--navy)}
.req .id{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.req .id b{color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.status{display:inline-flex;align-items:center;border-radius:999px;font-weight:700;font-size:12.5px;padding:5px 11px;white-space:nowrap}
.status.new{background:var(--red-tint);color:var(--red)}
.status.in_review{background:var(--amber-tint);color:var(--amber)}
.status.resolved{background:var(--green-tint);color:var(--green)}
.timeline{list-style:none;margin:18px 0 0;padding:0 0 0 4px}
.timeline li{display:flex;gap:12px;position:relative;padding-bottom:16px}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .dot{width:24px;height:24px;border-radius:50%;border:2px solid #C3C8D8;background:#fff;flex:none;display:grid;place-items:center;position:relative;z-index:1}
.timeline .dot svg{width:13px;height:13px;stroke:#fff;stroke-width:3}
.timeline li.done .dot{background:var(--green);border-color:var(--green)}
.timeline li.cur .dot{border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-tint)}
.timeline li.done::before{background:var(--green)}
.timeline b{display:block;font-size:14.5px}
.timeline small{color:var(--muted);font-size:12.5px}
details.dev{margin-top:16px;background:#0E1330;color:#C9D1F5;border-radius:14px;overflow:hidden}
details.dev summary{cursor:pointer;padding:12px 14px;font-size:13px;font-weight:700;color:#fff;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.dev summary::-webkit-details-marker{display:none}
details.dev summary::after{content:"+";font-size:18px;opacity:.7}
details.dev[open] summary::after{content:"–"}
details.dev pre{margin:0;padding:0 14px 14px;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.demo{display:block;margin:12px auto 0;font-size:12.5px;font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

/* ---------- Support ---------- */
.sos{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-lg);background:linear-gradient(135deg,#D0021B,#9E0016);color:#fff;box-shadow:0 10px 24px rgba(208,2,27,.25);margin-top:16px}
.sos .ri{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.sos b{display:block;font-size:16px}
.sos small{display:block;font-size:13px;opacity:.88;margin-top:1px}
.sos .num{font-size:14px;font-weight:800;margin-top:4px;letter-spacing:.01em}
.sos .call{margin-left:auto;background:#fff;color:var(--red);border-radius:999px;padding:9px 14px;font-weight:800;font-size:14px;flex:none}
.reqrow{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%}
.reqrow+.reqrow{border-top:1px solid var(--line)}
.reqrow .rt{flex:1;min-width:0}
.reqrow .rt b{display:block;font-size:14.5px}
.reqrow .rt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:14px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--muted)}
.search input{padding-left:42px}
.filter{display:flex;gap:8px;overflow-x:auto;margin:12px -18px 0;padding:0 18px 4px}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;padding:8px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:13.5px;color:#2A3156}
.filter button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.filter button small{opacity:.65;font-weight:600;margin-left:3px}
.faq{margin-top:12px}
.faq details{border-top:1px solid var(--line)}
.faq details:first-child{border-top:0}
.faq summary{list-style:none;cursor:pointer;padding:15px 14px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:14.8px;line-height:1.3}
.faq summary::-webkit-details-marker{display:none}
.faq summary span{flex:1}
.faq summary svg{width:18px;height:18px;color:var(--muted);transition:transform .2s;flex:none}
.faq details[open] summary svg{transform:rotate(90deg)}
.faq .ans{padding:0 14px 15px;font-size:14px;line-height:1.5;color:#3A4166}
.faq .ans a{color:var(--red);font-weight:600}
.reset-link{display:block;margin:26px auto 0;color:var(--muted);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ---------- Explore ---------- */
.illo{position:relative;overflow:hidden}
.illo svg{position:absolute;inset:auto 0 0 0;width:100%;height:78%}
.illo .city{position:absolute;left:10px;top:10px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.18);padding:3px 7px;border-radius:6px}
.res{display:flex;gap:12px;padding:10px;width:100%;align-items:stretch}
.res+.res{margin-top:10px}
.res .th{width:100px;min-height:96px;border-radius:14px;overflow:hidden;flex:none;position:relative}
.res .th img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;z-index:1}
.res .rt{flex:1;min-width:0;display:flex;flex-direction:column;padding:2px 2px 2px 0}
.res .rt b{font-size:15.5px;line-height:1.25}
.res .rt small{color:var(--muted);font-size:12.8px;margin-top:3px;display:flex;gap:4px;align-items:center}
.res .rt small svg{width:14px;height:14px}
.res .price{margin-top:auto;padding-top:8px;font-size:13px;color:var(--muted)}
.res .price b{font-size:16px;color:var(--text)}
.res .price .so{color:var(--red);font-weight:700}
.res .price .na{color:var(--navy);font-weight:700}
.hero{position:relative;height:240px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;z-index:1}
.hero .illo{position:absolute;inset:0}
.hero .ptag{position:absolute;right:12px;bottom:12px;background:rgba(11,20,64,.62);color:#fff;font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px}
.detail{background:var(--bg);border-radius:24px 24px 0 0;margin-top:-22px;position:relative;padding-top:20px}
.addr{display:flex;gap:6px;align-items:flex-start;color:var(--muted);font-size:14px;margin-top:8px;line-height:1.4}
.addr svg{width:18px;height:18px;margin-top:1px}
.pricebox{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;margin-top:16px}
.pricebox span{font-size:13px;color:var(--muted)}
.pricebox b{font-size:22px;font-weight:800}
.desc{font-size:15px;line-height:1.55;color:#2A3156;margin:16px 0 0}

/* ---------- Sheet & toast ---------- */
.sheet-wrap{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(11,20,64,.42);animation:fade .2s ease}
.sheet{position:relative;background:#fff;border-radius:26px 26px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 26px);max-height:88%;overflow-y:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#D5D8E3;margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:21px;font-weight:800;letter-spacing:-.015em}
.sheet .sub{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .actions{display:grid;gap:10px;margin-top:20px}
.cat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat button{padding:12px;border-radius:14px;border:1.5px solid var(--line);font-weight:700;font-size:13.5px;display:flex;gap:8px;align-items:center;min-height:52px}
.cat button svg{width:19px;height:19px;color:var(--navy)}
.cat button.on{border-color:var(--navy);background:#EEF1FB}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:absolute;left:50%;bottom:112px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;font-size:14px;font-weight:600;padding:12px 16px;border-radius:14px;box-shadow:0 10px 24px rgba(11,20,64,.3);opacity:0;transition:all .25s ease;z-index:30;pointer-events:none;display:flex;gap:8px;align-items:center;max-width:86%;width:max-content}
.toast svg{width:18px;height:18px;stroke:#7EE2A8;stroke-width:2.6}
.toast.show{opacity:1;transform:translateX(-50%)}
.fadein{animation:fade .22s ease}
/* ---------- Phones: full-screen app (kept last so it overrides) ---------- */
@media (max-width:520px), (pointer:coarse) and (max-width:932px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
  .stage{position:fixed;inset:0;padding:0;display:block;min-height:0}
  .device{position:absolute;inset:0;width:auto;height:auto;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
  .screen{border-radius:0;max-width:600px;margin:0 auto;box-shadow:0 0 0 1px var(--line)}
  .statusbar,.homebar,.pitch{display:none!important}
  .appbar{padding-top:calc(env(safe-area-inset-top) + 10px)!important;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
  .tabbar{padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom))}
}</style>
</head>

const STORE_KEY = "gobritanya_student_proto_v1";
function defaultState() {
  return {
    lang: "en",
    checklist: { arrival: false, id: false, keys: false },
    arrival: null,                      // { date, time }
    requests: JSON.parse(JSON.stringify(APP_DATA.seedRequests)),
    seq: 8
  };
}
function loadState() {
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && s.requests) return Object.assign(defaultState(), s); } catch (e) {}
  return defaultState();
}
let state = loadState();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

// Single place where requests are created → later: POST to portal API / HubSpot
function createRequest(type, details, team) {
  const s = APP_DATA.student, r = resById(s.residenceId);
  const req = {
    id: `REQ-${new Date().getFullYear()}-${String(state.seq++).padStart(4, "0")}`,
    type,                                   // extension | support | arrival | enquiry
    status: "new",                          // new | in_review | resolved
    createdAt: new Date().toISOString(),
    source: "student_app",
    student: { id: s.id, name: `${s.firstName} ${s.lastInitial}`, email: s.email },
    residence: { id: r.id, name: r.name, city: r.city },
    assignedTo: { team: team.en },          // stored in English for the portal
    details,
    integration: { hubspot: { objectType: "ticket", pipeline: "student_requests", synced: false, externalId: null } }
  };
  state.requests.unshift(req);
  save();
  return req;
}

const CITY_COL = { London: ["#0B1440", "#2B3F94"], Leeds: ["#8E0013", "#D0021B"], Brighton: ["#0F5E6E", "#2A9BB0"], Dublin: ["#1C6B3C", "#3FA36A"] };
function illo(r) {
  const [a, b] = CITY_COL[r.city] || CITY_COL.London;
  let h = 0; for (const ch of r.id) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  let svg = "", x = 4;
  while (x < 156) {
    const w = 18 + (h % 16); h = (h * 1103515245 + 12345) >>> 0;
    const ht = 34 + (h % 50); h = (h * 1103515245 + 12345) >>> 0;
    svg += `<rect x="${x}" y="${100 - ht}" width="${w}" height="${ht}" rx="2" fill="rgba(255,255,255,${0.14 + (h % 10) / 60})"/>`;
    for (let wy = 100 - ht + 6; wy < 92; wy += 9) for (let wx = x + 4; wx < x + w - 4; wx += 7)
      if ((wx * wy + h) % 5) svg += `<rect x="${wx}" y="${wy}" width="3" height="4" fill="rgba(255,255,255,.55)"/>`;
    x += w + 3;
  }
  return `<div class="illo" style="position:absolute;inset:0;background:linear-gradient(140deg,${a},${b})"><span class="city">${esc(r.city)}</span><svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMax slice">${svg}</svg></div>`;
}
const photoImg = (src, fallback, alt) => `<img src="${src}" alt="${esc(alt || "")}" loading="lazy" onerror="${fallback ? `this.onerror=null;this.src='${fallback}'` : "this.remove()"}">`;

function appbar(title) {
  if (!title) return `<header class="appbar"><div class="logo"><span class="go">Go</span><span class="br">Britanya</span></div>${langToggle()}</header>`;
  return `<header class="appbar"><button class="iconbtn" data-action="back" aria-label="Back">${ic("back")}</button><div class="title">${esc(title)}</div>${langToggle()}</header>`;
}
function tabbar() {
  const tabs = [["home", "home", t("tabHome")], ["stay", "bed", t("tabStay")], ["support", "headset", t("tabSupport")]];
  return `<nav class="tabbar">${tabs.map(([id, icon, lbl]) =>

}

function render(opts = {}) {
  const main = document.getElementById("main");
  const keep = opts.keepScroll && main ? main.scrollTop : 0;
  const top = nav.stack[nav.stack.length - 1];
  let title = null, body;
  if (!top) body = { home: screenHome, stay: screenStay, support: screenSupport }[nav.tab]();
  else if (top.name === "extension") { title = t("extTitle"); body = screenExtension(); }
  else if (top.name === "request") { title = L(I18N[state.lang].reqTitle[(state.requests.find(r => r.id === top.id) || {}).type] || ""); body = screenRequest(top.id, top.fresh); }
  else if (top.name === "explore") { title = t("explore"); body = screenExplore(); }
  else if (top.name === "residence") { title = resById(top.id).short; body = screenResidence(top.id); }
  $app.innerHTML = appbar(title) + `<main class="main ${opts.anim ? "fadein" : ""}" id="main">${body}</main>` + tabbar() + renderSheet();
  document.documentElement.lang = state.lang;
  const m = document.getElementById("main");
  m.scrollTop = keep;
  m.addEventListener("scroll", () => document.querySelector(".appbar").classList.toggle("scrolled", m.scrollTop > 4), { passive: true });
  renderPitch();
}
function go(tab) { nav.tab = tab; nav.stack = []; ui.sheet = null; render({ anim: true }); }
function push(view) { nav.stack.push(view); render({ anim: true }); }
function back() { nav.stack.pop(); render({ anim: true }); }

function teamLabel(en) {
  // reverse-lookup the TR label of a stored team name
  const all = [APP_DATA.teams.arrival(), APP_DATA.teams.enquiry(), ...Object.values(APP_DATA.teams.support)];
  const hit = all.find(x => x.en === en);
  if (hit) return L(hit);
  const m = en.match(/^(.*) team$/); if (m && state.lang === "tr") return `${m[1]} ekibi`;
  return en;
}
function screenRequest(id, fresh) {

  if (r.soldOut) return `<span class="so">${t("soldOut")}</span>`;
  if (r.price == null) return `<span class="na">${t("priceAsk")}</span>`;
  return `${t("from")} <b>£${r.price}</b>${t("wk")}`;
}
function screenExplore() {
  const cities = ["all", "London", "Leeds", "Brighton", "Dublin"];
  const cnt = c => (c === "all" ? APP_DATA.residences.length : APP_DATA.residences.filter(r => r.city === c).length);
  return `
  <section class="pad" style="padding-top:14px">
    <div class="search">${ic("search")}<input id="resSearch" class="field" type="search" placeholder="${esc(t("searchRes"))}" value="${esc(ui.resQ)}"></div>
    <div class="filter">${cities.map(c => `<button class="${ui.resCity === c ? "on" : ""}" data-action="resCity" data-city="${c}">${c === "all" ? t("all") : c}<small>${cnt(c)}</small></button>`).join("")}</div>
    <div id="resList">${resList()}</div>
  </section>`;
}
function screenResidence(id) {
  const r = resById(id), mine = id === APP_DATA.student.residenceId;
  return `
  <div class="hero">${illo(r)}${r.photo ? photoImg(r.photo, mine ? IMG.kirby : "", r.name) : ""}</div>
  <div class="detail"><section class="pad">
    ${mine ? `<span class="pill" style="background:var(--red-tint);color:var(--red)">${ic("home")} ${t("yourHome")}</span>` : ""}
    <h1 class="h1" style="font-size:28px;margin-top:${mine ? 10 : 0}px">${esc(r.name)}</h1>
    <div class="addr">${ic("pin")}<span>${esc(r.address)}</span></div>
    <div class="card pricebox"><span>${r.soldOut || r.price == null ? "" : t("from")}</span><div>${r.soldOut ? `<b style="color:var(--red);font-size:18px">${t("soldOut")}</b>` : r.price == null ? `<b style="font-size:17px">${t("priceAsk")}</b>` : `<b>£${r.price}</b><span>${t("wk")}</span>`}</div></div>
    <p class="desc">${esc(r.desc || t("descFallback"))}</p>
    ${r.roomPhoto ? `<h3 class="h3" style="margin-top:22px">${t("roomPhoto")}</h3><div class="photo">${photoImg(r.roomPhoto, "", r.name)}</div>` : ""}
    ${r.features.length ? `<h3 class="h3 sec" style="margin-top:22px">${t("highlights")}</h3><div class="chips">${r.features.map(f => `<span class="chip">${ic("check")}${esc(f)}</span>`).join("")}</div>` : ""}
    <h3 class="h3" style="margin-top:22px">${t("everyRes")}</h3>
    <div class="chips">${t("everyList").map(f => `<span class="chip">${ic("check")}${esc(f)}</span>`).join("")}</div>
    <div style="display:grid;gap:10px;margin-top:22px">
      ${mine ? "" : `<button class="btn btn--red" data-action="enquire" data-id="${r.id}">${t("askAbout")}</button>`}
      <a class="btn btn--ghost" href="${r.url}" target="_blank" rel="noopener">${t("viewWeb")} ${ic("ext")}</a>
    </div>
  </section></div>`;
}

/* ------------------------------ Sheets ----------------------------- */
function renderSheet() {
  if (!ui.sheet) return "";
  let inner = "";
  if (ui.sheet === "arrival") {
    const a = state.arrival || { date: APP_DATA.student.contractStart, time: "15:00" };
    inner = `<h3>${t("arrTitle")}</h3><p class="sub">${t("arrSub")}</p>
      <div class="two"><div><label class="label" for="arrDate">${t("date")}</label><input id="arrDate" class="field" type="date" value="${a.date}"></div>
      <div><label class="label" for="arrTime">${t("time")}</label><input id="arrTime" class="field" type="time" value="${a.time}"></div></div>
      <div class="info warn" id="lateNote" style="${a.time >= "18:00" ? "" : "display:none"}">${ic("alert")}<span>${t("lateNote")}</span></div>
      <div class="actions"><button class="btn btn--red" data-action="saveArrival">${t("saveArrival")}</button>
      ${state.arrival ? `<button class="btn btn--ghost" data-action="clearArrival">${t("clear")}</button>` : `<button class="btn btn--ghost" data-action="closeSheet">${t("cancel")}</button>`}</div>`;
  }
  if (ui.sheet === "support") {
    const icons = { maintenance: "tool", payments: "card", checkin: "door", wellbeing: "heart", other: "dots" };
    inner = `<h3>${t("supTitle")}</h3><p class="sub">${t("supSub")}</p>
      <label class="label">${t("category")}</label>
      <div class="cat">${Object.keys(icons).map(k => `<button class="${ui.sup.cat === k ? "on" : ""}" data-action="supCat" data-cat="${k}">${ic(icons[k])}${I18N[state.lang].supCat[k]}</button>`).join("")}</div>
      <label class="label" for="supMsg">${t("message")}</label>
      <textarea id="supMsg" class="field" maxlength="800" placeholder="${esc(t("messagePh"))}">${esc(ui.sup.msg)}</textarea>
      <p class="sub" style="margin-top:10px;font-size:13px">${ic("users")} ${t("assignedTo", L(APP_DATA.teams.support[ui.sup.cat]))}</p>
      <div class="actions"><button class="btn btn--red" data-action="submitSupport">${t("submit")}</button>
      <button class="btn btn--ghost" data-action="closeSheet">${t("cancel")}</button></div>`;
  }
  return `<div class="sheet-wrap"><div class="scrim" data-action="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${inner}</div></div>`;
}
function openSheet(name) { ui.sheet = name; render({ keepScroll: true }); }
function closeSheet() { ui.sheet = null; render({ keepScroll: true }); }

/* ------------------------------ Toast ------------------------------ */
let toastTimer;
function toast(msg) {
  let el = document.querySelector(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; document.getElementById("screen").appendChild(el); }
  el.innerHTML = ic("check") + `<span>${esc(msg)}</span>`;
  requestAnimationFrame(() => el.classList.add("show"));
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

/* ------------------------------ Pitch ------------------------------ */
function renderPitch() {
  const el = document.getElementById("pitch");
  if (!el || getComputedStyle(el).display === "none") return;
  el.innerHTML = `<div class="logo"><span class="go">Go</span><span class="br">Britanya</span></div>
    <h2>${t("pitchTitle")}</h2><p class="ver">${t("pitchVer")}</p>
    <ol>${t("pitch").map((p, i) => `<li><span class="n">${i + 1}</span><span><b>${p[0]}</b>${p[1]}</span></li>`).join("")}</ol>
    <p class="src">${t("pitchSrc")}</p>
    <button class="reset" data-action="reset">↺ ${t("reset")}</button>`;
}

/* ------------------------------ Events ----------------------------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  switch (a) {
    case "tab": {
      go(el.dataset.tab);
      if (el.dataset.scroll) setTimeout(() => { const s = document.getElementById(el.dataset.scroll); if (s) document.getElementById("main").scrollTop = s.offsetTop - 10; }, 0);
      break;
    }
    case "push": push({ name: el.dataset.view, id: el.dataset.id }); break;
    case "back": back(); break;
    case "lang": state.lang = el.dataset.lang; save(); render({ keepScroll: true }); break;
    case "sheet": openSheet(el.dataset.sheet); break;
    case "closeSheet": closeSheet(); break;
    case "check": {
      const id = el.dataset.id;
      if (id === "arrival") return openSheet("arrival");
      state.checklist[id] = !state.checklist[id]; save(); render({ keepScroll: true }); break;
    }
    case "saveArrival": {
      const date = document.getElementById("arrDate").value, time = document.getElementById("arrTime").value;
      if (!date || !time) return;
      state.arrival = { date, time }; state.checklist.arrival = true;
      createRequest("arrival", { arrivalDate: date, arrivalTime: time, lateArrival: time >= "18:00" }, APP_DATA.teams.arrival());
      ui.sheet = null; render({ keepScroll: true }); toast(t("arrivalSaved")); break;
    }
    case "clearArrival": state.arrival = null; state.checklist.arrival = false; save(); closeSheet(); break;
    case "weeks": case "weeksSet": {
      ui.ext.weeks = a === "weeks" ? Math.min(26, Math.max(1, ui.ext.weeks + +el.dataset.d)) : +el.dataset.n;
      const n = document.getElementById("extNote"); if (n) ui.ext.note = n.value;
      render({ keepScroll: true }); break;
    }
    case "submitExt": {
      const s = APP_DATA.student, r = resById(s.residenceId);
      ui.ext.note = (document.getElementById("extNote") || {}).value || "";
      const req = createRequest("extension", {
        additionalWeeks: ui.ext.weeks, currentEndDate: s.contractEnd,
        requestedEndDate: addDays(s.contractEnd, ui.ext.weeks * 7), note: ui.ext.note.trim()
      }, APP_DATA.teams.extension(r.city));
      ui.ext = { weeks: 4, note: "" };
      nav.stack = [{ name: "request", id: req.id, fresh: true }]; render({ anim: true }); break;
    }
    case "advance": {
      const q = state.requests.find(r => r.id === el.dataset.id);
      if (q) { q.status = STATUS_ORDER[Math.min(2, STATUS_ORDER.indexOf(q.status) + 1)]; save(); render({ keepScroll: true }); }
      break;
    }
    case "supCat": ui.sup.cat = el.dataset.cat; ui.sup.msg = document.getElementById("supMsg").value; render({ keepScroll: true }); break;
    case "submitSupport": {
      const msg = document.getElementById("supMsg").value.trim();
      if (!msg) { toast(t("needText")); document.getElementById("supMsg").focus(); return; }
      const team = APP_DATA.teams.support[ui.sup.cat];
      createRequest("support", { category: ui.sup.cat, message: msg }, team);
      ui.sup = { cat: "maintenance", msg: "" }; ui.sheet = null;
      if (nav.tab !== "support" || nav.stack.length) { nav.tab = "support"; nav.stack = []; render({ anim: true }); } else render({ keepScroll: true });
      toast(t("supSent", L(team))); break;
    }
    case "enquire": {
      const r = resById(el.dataset.id);
      createRequest("enquiry", { residenceId: r.id, residenceName: r.name, residenceCity: r.city }, APP_DATA.teams.enquiry());
      toast(t("askSent")); break;
    }
    case "faqCat": ui.faqCat = el.dataset.cat; render({ keepScroll: true }); break;
    case "resCity": ui.resCity = el.dataset.city; render({ keepScroll: true }); break;
    case "copy": {
      const code = el.dataset.code;
      try { navigator.clipboard && navigator.clipboard.writeText(code); } catch (err) {}
      toast(t("copied", code)); break;
    }
    case "reset": {
      const lang = state.lang; state = defaultState(); state.lang = lang; save();
      ui = { sheet: null, faqCat: "all", faqQ: "", resCity: "all", resQ: "", ext: { weeks: 4, note: "" }, sup: { cat: "maintenance", msg: "" } };
      go("home"); toast(t("resetDone")); break;
    }
  }
});
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "faqSearch") { ui.faqQ = e.target.value; document.getElementById("faqList").innerHTML = faqList(); }
  if (id === "resSearch") { ui.resQ = e.target.value; document.getElementById("resList").innerHTML = resList(); }
  if (id === "extNote") ui.ext.note = e.target.value;
  if (id === "supMsg") ui.sup.msg = e.target.value;
  if (id === "arrTime") document.getElementById("lateNote").style.display = e.target.value >= "18:00" ? "" : "none";
});
window.addEventListener("resize", renderPitch);

function tick() { const d = new Date(); document.getElementById("clock").textContent = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); }
tick(); setInterval(tick, 30000);
render();
</script>
</body>
</html>
